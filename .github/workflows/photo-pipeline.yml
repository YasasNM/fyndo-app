# Finds official links and real photos for places, every Sunday, for free (see tools/photo-pipeline/pipeline.py).
# Needs these GitHub secrets (repo Settings > Secrets and variables > Actions):
#   NEXT_PUBLIC_SUPABASE_URL      (already there for the website)
#   SUPABASE_SERVICE_ROLE_KEY     Supabase > Project Settings > API keys > secret / service_role key. Keep it secret.
#   GEMINI_API_KEY and/or GROQ_API_KEY   free AI keys (optional, but without them no links are searched
#                                        and photos are checked by size only)
# Run it by hand: Actions > Find place photos > Run workflow.
name: Find place photos

on:
  schedule:
    - cron: "30 20 * * 6"   # Sunday 02:00 Sri Lanka time
  workflow_dispatch:
    inputs:
      limit:
        description: "How many places to check this run"
        default: "25"
      only:
        description: "Only this place id (optional)"
        default: ""
      dry_run:
        description: "Dry run: show what would change, save nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: photo-pipeline
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/photo-pipeline/requirements.txt

      - name: Install Scrapling and a browser for pages that need JavaScript
        run: |
          pip install -r tools/photo-pipeline/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Find links and photos
        working-directory: tools/photo-pipeline
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LIMIT: ${{ github.event.inputs.limit || '25' }}
          ONLY: ${{ github.event.inputs.only }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          python test_pipeline.py
          case "$LIMIT" in ''|*[!0-9]*) LIMIT=25 ;; esac
          set -- --limit "$LIMIT"
          if [ -n "$ONLY" ]; then set -- "$@" --only "$ONLY"; fi
          if [ "$DRY_RUN" = "true" ]; then set -- "$@" --dry-run; fi
          python pipeline.py "$@"
